[project]
name = "python-backend-starter"
version = "1.0.0"
description = "Reusable Python backend starter template with Docker, PostgreSQL, Redis, testing, and code quality tooling."
authors = [
    {name = "JohannGaviria", email = "johannmgr@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv (>=1.2.3,<2.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "fastapi (>=0.141.1,<1.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.1.1,<3.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.21"
mypy = "^2.3.0"
pre-commit = "^4.6.0"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.0.0"
faker = "^40.39.0"
httpx = "^0.28.1"
asgi-lifespan = "^2.1.0"

[tool.poetry.group.prod]
optional = true

[tool.poetry.group.prod.dependencies]
gunicorn = "^26.0.0"
uvicorn-worker = "^0.4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


# =========================
# PYTEST CONFIG
# =========================

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
    "db: tests that require a real PostgreSQL and/or Redis test instance",
    "e2e: tests that exercise the full HTTP application",
]


# =========================
# COVERAGE CONFIG
# =========================

[tool.coverage.run]
source = ["src"]
relative_files = true
omit = [
    "*/alembic/*",
    "*/conftest.py",
]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = false


# =========================
# RUFF CONFIG
# =========================

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*/alembic/versions",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "D",
]

ignore = [
    "E501",
    "B008",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = [
    "B",
    "D",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
case-sensitive = true
force-wrap-aliases = true
split-on-trailing-comma = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"


# =========================
# MYPY CONFIG
# =========================

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]

warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true

check_untyped_defs = true
disallow_untyped_defs = true
disallow_untyped_calls = false

ignore_missing_imports = false

exclude = [
    "^src/.*/alembic/versions/",
]

[[tool.mypy.overrides]]
module = [
    "tests.e2e.*",
    "tests.integration.*",
    "tests.unit.*",
]
disallow_untyped_defs = false