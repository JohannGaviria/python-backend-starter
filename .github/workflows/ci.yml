name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  POETRY_VERSION: "2.4.1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --no-root --with dev,test

      - name: Check code quality
        run: make check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --no-root --with test

      - name: Copy environment variables
        run: cp .env.example .env

      - name: Run unit tests
        run: make test-unit

      - name: Collect unit test coverage
        run: make test-coverage-unit

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-unit-${{ github.run_id }}
          path: tests/.coverage.unit*
          include-hidden-files: true
          retention-days: 1

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --no-root --with test

      - name: Copy environment variables
        run: cp .env.example .env

      - name: Run integration tests
        run: make test-integration

      - name: Collect integration test coverage
        run: make test-coverage-integration

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-integration-${{ github.run_id }}
          path: tests/.coverage.integration*
          include-hidden-files: true
          retention-days: 1

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --no-root --with test

      - name: Copy environment variables
        run: cp .env.example .env

      - name: Run e2e tests
        run: make test-e2e

      - name: Collect e2e test coverage
        run: make test-coverage-e2e

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-e2e-${{ github.run_id }}
          path: tests/.coverage.e2e*
          include-hidden-files: true
          retention-days: 1

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [lint, unit-tests, integration-tests, e2e-tests]

    steps:
      - name: Fail early if a required job failed
        if: |
          needs.lint.result != 'success' ||
          needs.unit-tests.result != 'success' ||
          needs.integration-tests.result != 'success' ||
          needs.e2e-tests.result != 'success'
        run: |
          echo "One or more previous jobs failed. Stopping coverage reporting."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --no-root --with test

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*-${{ github.run_id }}
          path: tests/
          merge-multiple: true

      - name: Combine coverage and enforce threshold
        run: make test-coverage-report
